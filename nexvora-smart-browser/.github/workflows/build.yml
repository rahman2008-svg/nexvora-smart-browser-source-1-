name: Build NexVora

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      generate_wrapper:
        description: "Also generate the Gradle wrapper files and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the Android SDK and accepts its licences on the clean runner.
      - uses: android-actions/setup-android@v3

      # Gradle 8.7 is installed by the action, so the build does not depend on a committed wrapper jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_wrapper }}
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Upload wrapper files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_wrapper }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # ---- Release signing: only when the repository has the four signing secrets configured.
      - name: Check for signing secrets
        id: signing
        env:
          KS: ${{ secrets.NEXVORA_KEYSTORE_BASE64 }}
          PW: ${{ secrets.NEXVORA_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.NEXVORA_KEY_ALIAS }}
          KP: ${{ secrets.NEXVORA_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ] && [ -n "$AL" ] && [ -n "$KP" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.NEXVORA_KEYSTORE_BASE64 }}
          NEXVORA_KEYSTORE_PASSWORD: ${{ secrets.NEXVORA_KEYSTORE_PASSWORD }}
          NEXVORA_KEY_ALIAS: ${{ secrets.NEXVORA_KEY_ALIAS }}
          NEXVORA_KEY_PASSWORD: ${{ secrets.NEXVORA_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexvora.jks"
          export NEXVORA_KEYSTORE="$RUNNER_TEMP/nexvora.jks"
          gradle :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/nexvora.jks"

      - name: Note when release is not signed
        if: steps.signing.outputs.available != 'true'
        run: echo "::notice::No signing secrets configured, so only the debug APK was built. See README, 'Release signing'."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexvora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nexvora-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/
            **/hs_err_pid*.log
          if-no-files-found: ignore
