
name: Build NexVora Smart Browser

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexvora-smart-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      # v4 fixes the deprecated SDK tools package issue.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. Verify Android project
      - name: Verify Project Structure
        run: |
          echo "Checking project..."

          test -d app || {
            echo "ERROR: app directory not found"
            exit 1
          }

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "Project structure verified."

      # 6. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 7. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          cp "$APK" release/NexVora-Smart-Browser.apk

          echo "APK ready:"
          ls -lh release/

      # 8. Unit Tests
      - name: Run Unit Tests
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # 9. Android Lint
      - name: Run Android Lint
        continue-on-error: true
        run: |
          gradle :app:lintDebug \
            --no-daemon \
            --stacktrace

      # 10. Publish direct APK
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexvora-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: NexVora Smart Browser Build ${{ github.run_number }}
          body: |
            # NexVora Smart Browser

            Android APK Release

            Build Number: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download the APK from Assets below.

          files: |
            release/NexVora-Smart-Browser.apk

          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      # 11. Upload test reports
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

