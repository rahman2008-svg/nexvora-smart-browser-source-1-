
name: Build NexVora Smart Browser APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexvora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Project
        run: |
          echo "Checking Android project..."
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          echo "Project structure verified."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" release/NexVora-Smart-Browser.apk

          echo "APK successfully prepared:"
          ls -lh release/

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        continue-on-error: true
        run: |
          gradle :app:lintDebug --no-daemon --stacktrace

      - name: Upload APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexvora-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: NexVora Smart Browser - Build ${{ github.run_number }}
          body: |
            NexVora Smart Browser Android APK

            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download the APK directly from the Assets section.
          files: release/NexVora-Smart-Browser.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

